# Publica el Worker "cavework-ranking" (API del Top 50 de CaveWork) cuando cambia en main.
# Necesita el secreto de GitHub CLOUDFLARE_API_TOKEN.

name: Desplegar ranking de CaveWork

on:
  push:
    branches: [main]
    paths:
      - "cavework/**"
      - ".github/workflows/cavework.yml"
  workflow_dispatch:

jobs:
  desplegar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4"
          workingDirectory: cavework
          command: deploy
