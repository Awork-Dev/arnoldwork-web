# Publica la carpeta web/ en el Worker "arnoldwork-v11" (arnoldwork.com).
# - Push a main: publica en arnoldwork.com.
# - Push a cualquier otra rama: sube una versión de prueba (sin tocar la web real)
#   y la deja en https://<rama>-arnoldwork-v11.arnoldwork.workers.dev
#
# Necesita el secreto de GitHub CLOUDFLARE_API_TOKEN.

name: Desplegar web

on:
  push:
    paths:
      - "web/**"
      - "wrangler.jsonc"
      - ".github/workflows/desplegar.yml"
  workflow_dispatch:

concurrency:
  group: desplegar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desplegar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Nombre de la vista previa
        id: alias
        run: echo "alias=$(echo '${{ github.ref_name }}' | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | cut -c1-30 | sed 's/-*$//')" >> "$GITHUB_OUTPUT"

      - name: Publicar en arnoldwork.com
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4"
          command: deploy

      - name: Subir vista previa
        if: github.ref != 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4"
          command: versions upload --preview-alias ${{ steps.alias.outputs.alias }}
