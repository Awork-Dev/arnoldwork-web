# Prueba puntual de la API de TurnoWork (se puede lanzar a mano).
name: Probar API de TurnoWork
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/probar-sync.yml"]
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a la API
        run: |
          a=$(curl -s -w ' [%{http_code}]' -X POST https://turnos.arnoldwork.com/api/sync -H 'Content-Type: application/json' -d '{"accion":"bajar","email":"prueba@example.com","codigo":"MALO"}')
          b=$(curl -s -w ' [%{http_code}]' -X POST https://turnos.arnoldwork.com/api/sync -H 'Content-Type: application/json' -d '{"accion":"crear","email":"prueba@example.com"}')
          c=$(curl -s -w ' [%{http_code}]' https://turnos.arnoldwork.com/cal/abcdefghijkmnpqrstuvwxyz2345.ics)
          d=$(curl -s -o /dev/null -w '[%{http_code}]' https://turnos.arnoldwork.com/)
          echo "::notice title=bajar::$a"
          echo "::notice title=crear::$b"
          echo "::notice title=cal::$c"
          echo "::notice title=web::$d"
