# Publica el Worker "vigilante" cuando cambia en main.
# Necesita el secreto de GitHub CLOUDFLARE_API_TOKEN.

name: Desplegar vigilante

on:
  push:
    branches: [main]
    paths:
      - "vigilante/**"
      - ".github/workflows/vigilante.yml"
  workflow_dispatch:

jobs:
  desplegar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4"
          workingDirectory: vigilante
          command: deploy
