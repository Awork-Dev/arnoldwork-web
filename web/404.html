<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Esta página no existe — ArnoldWork</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0A0A0A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
:root{--ink:#0A0A0A;--chalk:#F4F2EF;--chalk-dim:#A9A9A9;--amber:#E24848;--rule:rgba(244,242,239,.14)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--ink);color:var(--chalk);font-family:Archivo,system-ui,sans-serif;display:flex;flex-direction:column}
a{color:inherit}
header{border-bottom:1px solid var(--rule);padding:16px 20px}
.brand{font-family:'Archivo Black',Impact,sans-serif;font-size:1.25rem;text-decoration:none;letter-spacing:-.02em}
.brand img{height:26px;width:auto;margin-right:9px;vertical-align:-5px}
.brand span{color:var(--amber)}
main{flex:1;display:flex;align-items:center;padding:48px 20px}
.wrap{max-width:720px;margin:0 auto;width:100%}
.k{font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--chalk-dim);font-size:.85rem}
h1{font-family:'Archivo Black',Impact,sans-serif;font-weight:400;font-size:clamp(2.6rem,9vw,4.6rem);line-height:.98;letter-spacing:-.02em;margin:14px 0 0}
h1 em{font-style:normal;display:block;color:var(--amber)}
p{color:var(--chalk-dim);font-size:1.08rem;line-height:1.55;margin:22px 0 0;max-width:52ch}
.cta{display:flex;gap:14px;flex-wrap:wrap;margin-top:30px}
.btn{display:inline-block;background:var(--amber);color:#0A0A0A;font-weight:700;padding:14px 26px;text-decoration:none;clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%)}
.btn:hover{background:#B32B2B}
.btn-ghost{background:transparent;color:var(--chalk);border:1px solid rgba(244,242,239,.30);clip-path:none;font-weight:600}
.btn-ghost:hover{background:rgba(245,244,240,.07)}
</style>
</head>
<body>
<header><a class="brand" href="/"><img src="/img/logo.svg" alt="" width="26" height="34">Arnold<span>Work</span></a></header>
<main>
  <div class="wrap">
    <div class="k">Error 404</div>
    <h1>Esta página no existe.<em>Recoge los discos.</em></h1>
    <p>Puede que el enlace esté mal escrito o que la página ya no esté. Lo que buscas seguramente está en las herramientas o en el inicio.</p>
    <div class="cta">
      <a class="btn" href="/herramientas/">Abrir las herramientas</a>
      <a class="btn btn-ghost" href="/">Ir al inicio</a>
    </div>
  </div>
</main>
</body>
</html>
