<!doctype html>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
/*FUENTES*/
:root{--ink:#0A0A0A;--chalk:#F4F2EF;--dim:#A9A9A9;--red:#DE3A3A}
html,body{margin:0}
body{width:1200px;height:630px;background:var(--ink);color:var(--chalk);font-family:Archivo,sans-serif;position:relative;overflow:hidden;box-sizing:border-box;padding:70px 80px}
.brand{display:flex;align-items:center;gap:16px;font-family:'Archivo Black';font-size:40px;letter-spacing:-.02em}
.brand svg{height:56px}.brand span{color:var(--red)}
.k{margin-top:46px;font-size:24px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
h1{font-family:'Archivo Black';font-weight:400;font-size:96px;line-height:.98;letter-spacing:-.025em;margin:14px 0 0;max-width:1040px}
p{font-size:29px;color:var(--dim);margin:26px 0 0;max-width:960px;line-height:1.3}
.foot{position:absolute;left:80px;bottom:56px;font-size:24px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.foot b{color:var(--chalk)}
.rule{position:absolute;left:0;right:0;bottom:0;height:10px;background:var(--red)}
.amor{position:absolute;right:80px;bottom:56px;font-size:24px;font-weight:600;color:var(--chalk)}
.amor span{color:var(--red)}
</style>
<body>

<div class="k">Herramienta gratis</div>
