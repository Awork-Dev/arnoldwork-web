<div class="tool" id="recuperacion">
  <h2>Recuperación Heavy Duty</h2>
  <p class="hint">La rotación de <a href="https://heavywork.arnoldwork.com" target="_blank" rel="noopener" style="color:var(--amber)">HeavyWork</a>: A, B, C y D, con días de descanso entre sesiones. Marca el día que entrenas y te digo qué toca y cuándo estás listo para volver. Se guarda en tu móvil.</p>
  <div class="fields">
    <div class="field">
      <label for="hDesc">Días de descanso entre sesiones</label>
      <select id="hDesc" data-keep>
        <option value="3">3 días</option>
        <option value="4" selected>4 días</option>
        <option value="5">5 días</option>
        <option value="6">6 días</option>
        <option value="7">7 días</option>
      </select>
    </div>
  </div>
  <div class="hd" id="hGrid"></div>
  <div class="out">
    <div class="verdict"><span class="vtag" id="hTag">—</span><div class="big" id="hBig">—</div></div>
    <p class="vtxt" id="hTxt"></p>
    <div class="acts">
      <button type="button" class="btn btn-ghost btn-sm" id="hUndo">Deshacer el último</button>
      <button type="button" class="btn btn-ghost btn-sm" id="hReset">Empezar de cero</button>
    </div>
    <p class="cta-line">Para apuntar pesos y repeticiones de cada serie, usa <a href="https://heavywork.arnoldwork.com" target="_blank" rel="noopener">el cuaderno de HeavyWork →</a></p>
  </div>
</div>
