<div class="tool" id="descansos">
  <h2>Cronómetro de descansos</h2>
  <p class="hint">Elige el descanso y dale. Avisa con un pitido al terminar y, en la mayoría de móviles, mantiene la pantalla encendida mientras corre. Si el tuyo se bloquea igualmente, el aviso puede no sonar.</p>
  <div class="presets" id="tPresets">
    <button type="button" data-s="60">1:00 · fuerza ligera</button>
    <button type="button" data-s="90" class="on">1:30 · hipertrofia</button>
    <button type="button" data-s="120">2:00 · básicos</button>
    <button type="button" data-s="180">3:00 · fuerza</button>
    <button type="button" data-s="300">5:00 · Heavy Duty</button>
  </div>
  <div class="timer" id="tOut" aria-live="off">1:30</div>
  <div class="timer-cta">
    <button class="btn" id="tGo" type="button">Empezar</button>
    <button class="btn btn-ghost" id="tReset" type="button">Reiniciar</button>
  </div>
</div>
